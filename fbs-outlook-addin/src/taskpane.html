<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Save to SharePoint — FBS Re</title>

  <!-- Office JavaScript API (the sign-in library is loaded only by auth-dialog.html) -->
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

  <!-- Satoshi (with a close fallback) for a clean, modern look -->
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />

  <link rel="stylesheet" href="taskpane.css?v=5" />
</head>
<body>
  <div id="app">
    <header class="hdr">
      <img class="hdr-logo" src="../assets/icon-64.png" alt="FBS Re" />
      <div>
        <div class="hdr-title">Save to SharePoint</div>
        <div class="hdr-sub">FBS Reinsurance Limited</div>
      </div>
    </header>

    <!-- Sign-in gate -->
    <section id="authSection" class="card">
      <p class="muted">Sign in with your FBS Re account to save attachments into SharePoint.</p>
      <button id="signInBtn" class="btn btn-primary">Sign in</button>
      <div id="signedInAs" class="signed-in hidden">
        <span class="dot"></span><span id="userName"></span>
        <button id="signOutBtn" class="linkbtn">Sign out</button>
      </div>
    </section>

    <!-- Main flow (hidden until signed in) -->
    <main id="mainSection" class="hidden">

      <!-- Step 1: attachments -->
      <section class="card">
        <h2 class="step">1 · Choose attachments</h2>
        <div id="attList" class="att-list"><p class="muted">Loading attachments…</p></div>
      </section>

      <!-- Step 2: destination -->
      <section class="card">
        <h2 class="step">2 · Choose destination</h2>
        <label class="lbl" for="siteSelect">Department site</label>
        <select id="siteSelect" class="input"><option value="">Loading sites…</option></select>

        <label class="lbl" for="librarySelect">Document library</label>
        <select id="librarySelect" class="input" disabled><option value="">Pick a site first</option></select>

        <label class="lbl" for="folderPath">Folder (optional)</label>
        <input id="folderPath" class="input" type="text" placeholder="e.g. 2026/Treaty  — leave blank for the library root" />
      </section>

      <!-- Step 3: required details -->
      <section class="card">
        <h2 class="step">3 · Required details</h2>
        <div id="metaForm" class="meta-form"><p class="muted">Pick a library to load its required fields.</p></div>
      </section>

      <!-- Save -->
      <section class="card save-card">
        <button id="saveBtn" class="btn btn-primary btn-block" disabled>Save to SharePoint</button>
        <div id="status" class="status" role="status"></div>
      </section>
    </main>

    <footer class="ftr">....For Better Services</footer>
  </div>

  <script src="authConfig.js?v=5"></script>
  <script src="graph.js?v=5"></script>
  <script src="taskpane.js?v=6"></script>
</body>
</html>
